<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOSH Coach Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred sign-in card on the DOSH lilac studio ground */
:root{--bg:#F1EEFB;--glow:#E2DAFB;--card:#FFFFFF;--fg:#1D1B2A;--muted:#5E5A72;--line:#DCD6EE;--accent:#6A4FD8;--accent-fg:#FFFFFF;--err:#B4452E;--font:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131F;--glow:#2A2346;--card:#1F1C2C;--fg:#F1EEFA;--muted:#AAA4C2;--line:#3A3552;--accent:#9C86F0;--accent-fg:#15131F;--err:#F0937D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131F;--glow:#2A2346;--card:#1F1C2C;--fg:#F1EEFA;--muted:#AAA4C2;--line:#3A3552;--accent:#9C86F0;--accent-fg:#15131F;--err:#F0937D;color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(60% 50% at 50% 40%,var(--glow),var(--bg));background-color:var(--bg);color:var(--fg);font-family:var(--font);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;box-sizing:border-box}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 28px;box-sizing:border-box;box-shadow:0 18px 50px -24px rgba(60,40,140,.35);display:grid;gap:18px}
.mark{width:44px;height:44px;border-radius:13px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:22px}
h1{margin:0;font-size:24px;font-weight:600;text-wrap:balance}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
form{display:grid;gap:10px}
label{font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--muted)}
input{font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:16px;font-weight:600;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);cursor:pointer;transition:transform .12s}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:14px;min-height:20px}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
<main class="card">
  <div class="mark" aria-hidden="true">D</div>
  <div style="display:grid;gap:6px">
    <h1>DOSH Coach Prototype</h1>
    <p>A preview for the DOSH team. Enter the password you were sent to open it.</p>
  </div>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="submit">Open prototype</button>
  </form>
  <div class="foot">Prepared by Doshi &middot; Confidential</div>
</main>

<script>
(function(){
  var P=JSON.parse(document.getElementById("payload").textContent);
  var u8=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var KEY="doshCoachKey";
  function show(html){
    var go=function(){setTimeout(function(){document.open();document.write(html);document.close()},0)};
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go();
  }
  async function decrypt(key){
    var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c));
    return new TextDecoder().decode(buf);
  }
  async function fromStore(){
    var raw=null;try{raw=sessionStorage.getItem(KEY)}catch(e){}
    if(!raw)return;
    try{var k=await crypto.subtle.importKey("raw",u8(raw),"AES-GCM",false,["decrypt"]);show(await decrypt(k))}catch(e){}
  }
  document.getElementById("f").addEventListener("submit",async function(e){
    e.preventDefault();
    var btn=document.getElementById("go"),err=document.getElementById("err");
    btn.disabled=true;btn.textContent="Opening…";err.textContent="";
    try{
      var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
      var raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
      var html=await decrypt(key);
      try{sessionStorage.setItem(KEY,btoa(String.fromCharCode.apply(null,raw)))}catch(e){}
      show(html);
    }catch(x){
      btn.disabled=false;btn.textContent="Open prototype";
      err.textContent="That password didn't work. Check it and try again.";
    }
  });
  fromStore();
})();
</script>
